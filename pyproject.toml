[project]
name = "telegram-status-bot-template"
version = "0.1.0"
description = "Production-ready webhook-only Telegram bot template using FastAPI and Aiogram."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "aiogram>=3.20.0,<4.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic-settings>=2.8.0,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
